name: Keio Shukatsu CAMP — Instagram Token Refresh

on:
  schedule:
    # 毎月1日 JST 10:15 = UTC 01:15
    # GitHub Actions cron は毎時0分が高負荷で遅延するため、:15 にズラしている
    - cron: '15 1 1 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: keio-shukatsu-camp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: keio-shukatsu-camp/package-lock.json

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Refresh Instagram long-lived token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          NEW_TOKEN=$(node scripts/refresh-token.js --token-only)
          if [ -z "$NEW_TOKEN" ]; then
            echo "::error::refresh-token.js produced empty output"
            exit 1
          fi
          if [ "$NEW_TOKEN" = "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "Token unchanged (refresh likely no-op). Continuing without secret update."
            exit 0
          fi
          echo "::add-mask::$NEW_TOKEN"
          gh secret set INSTAGRAM_ACCESS_TOKEN \
            --body "$NEW_TOKEN" \
            --repo "${{ github.repository }}"
          echo "✅ INSTAGRAM_ACCESS_TOKEN updated in repository secrets"
