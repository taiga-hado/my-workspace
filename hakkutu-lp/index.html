<!DOCTYPE html>
<html lang="ja">
<head>

  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      color: #1F2937;
      background: #f6f7f4;
      padding-bottom: 96px;
    }
    img { max-width: 100%; height: auto; display: block; }
    a { text-decoration: none; color: inherit; }

    .wrap {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 0 40px rgba(0,0,0,0.05);
      position: relative;
    }

    /* ===== HEADER (ロゴ差し替え) ===== */
    .lp-header {
      padding: 14px 18px;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .logo-slot {
      /* ここにロゴ画像を入れる: <img src="logo.png" alt="ハックツ就職" style="max-height:32px"> */
      height: 32px;
    }

    /* ===== SECTION IMAGES ===== */
    .section-img {
      width: 100%;
      display: block;
    }

    /* ===== INLINE CTA SLOT ===== */
    .cta-slot {
      padding: 20px 18px;
      background: #fff;
    }
    .cta-slot .placeholder {
      /* ここにCTAボタンを入れる。空の場合はシンプルな余白 */
      display: block;
      height: 60px;
    }

    /* ===== FLOATING CTA (差し替え) ===== */
    .floating-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      z-index: 100;
      display: flex;
      justify-content: center;
    }
    .floating-cta-slot {
      /* ここに追従CTAボタンを入れる。空の場合は目に見えない余白 */
      display: block;
      width: 100%;
      max-width: 388px;
      height: 60px;
    }

    /* ===== FOOTER ===== */
    footer {
      padding: 28px 20px 20px;
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
      background: #f9fafb;
    }
    .footer-logo-slot {
      /* ここにロゴ画像を入れる */
      height: 36px;
      margin: 0 auto 14px;
    }
    footer .fnav {
      margin-bottom: 14px;
    }
    footer .fnav a {
      margin: 0 8px;
      color: #6b7280;
    }
    footer .fnav a:hover { color: #3DB66A; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="cta-slot">
      <a href="#" class="placeholder"></a>

    <footer>

    </footer>

  </div>

</body>
</html>
