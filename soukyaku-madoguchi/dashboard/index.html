<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問い合わせダッシュボード | 求職者送客の窓口</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="shortcut icon" href="../images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    body { background: var(--bg-muted); }
    .dash-wrap { max-width: 1400px; margin: 0 auto; padding: 120px 24px 64px; }
    .dash-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .dash-title { font-size: 1.75rem; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
    .dash-title .count { color: var(--brand-blue); margin-left: 10px; font-size: 0.9em; }
    .dash-note {
      padding: 12px 16px; background: #fff8e1; border: 1px solid #f5d680;
      border-radius: var(--r-md); font-size: 0.82rem; color: #8a6200;
      margin-bottom: 20px; line-height: 1.65;
    }
    .dash-toolbar {
      display: grid; grid-template-columns: 1fr auto auto; gap: 10px;
      background: #fff; border: 1px solid var(--border); border-radius: var(--r-lg);
      padding: 14px; margin-bottom: 20px; align-items: center;
    }
    .dash-toolbar input, .dash-toolbar select {
      font-family: inherit; font-size: 0.9rem;
      padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: var(--r-md); background: #fff; color: var(--ink);
      -webkit-appearance: none; appearance: none;
    }
    .dash-toolbar input:focus, .dash-toolbar select:focus {
      outline: none; border-color: var(--brand-blue);
    }
    .dash-btn {
      padding: 10px 16px; font-size: 0.85rem; font-weight: 700;
      background: var(--brand-navy); color: #fff;
      border: none; border-radius: var(--r-md); cursor: pointer;
      transition: background 0.2s;
    }
    .dash-btn:hover { background: var(--brand-blue); }
    .dash-btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--border); }
    .dash-btn.ghost:hover { border-color: var(--brand-blue); color: var(--brand-blue); background: #fff; }
    .dash-btn.danger { background: #ef4444; }
    .dash-btn.danger:hover { background: #dc2626; }

    .dash-stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
      margin-bottom: 24px;
    }
    .dash-stat {
      background: #fff; border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 18px 20px;
    }
    .dash-stat-label { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; letter-spacing: 0.06em; margin-bottom: 6px; }
    .dash-stat-value { font-size: 1.6rem; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
    .dash-stat-value .unit { font-size: 0.6em; color: var(--text-sub); margin-left: 4px; font-weight: 600; }

    .dash-table-wrap {
      background: #fff; border: 1px solid var(--border); border-radius: var(--r-lg);
      overflow: hidden;
    }
    .dash-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .dash-table th, .dash-table td {
      text-align: left; padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: top;
    }
    .dash-table th {
      background: var(--bg-muted); font-weight: 700; font-size: 0.8rem;
      color: var(--text-sub); letter-spacing: 0.04em;
      position: sticky; top: 0; z-index: 1;
    }
    .dash-table tr:last-child td { border-bottom: none; }
    .dash-table tr:hover td { background: #fafbff; }
    .dash-table .col-date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-sub); font-size: 0.82rem; }
    .dash-table .col-company { font-weight: 700; color: var(--ink); }
    .dash-table .pill {
      display: inline-block; font-size: 0.72rem; font-weight: 700;
      padding: 3px 10px; border-radius: var(--r-pill);
      background: var(--brand-blue-soft); color: var(--brand-blue);
      white-space: nowrap;
    }
    .dash-table .pill.inquiry { background: var(--gold-soft); color: var(--gold-dark); }
    .dash-table .col-msg { max-width: 320px; color: var(--text); white-space: pre-wrap; }
    .dash-row-actions { display: flex; gap: 6px; }
    .dash-row-actions button {
      font-size: 0.75rem; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: var(--r-sm);
      background: #fff; cursor: pointer;
    }
    .dash-row-actions button:hover { border-color: var(--brand-blue); color: var(--brand-blue); }
    .dash-row-actions button.del:hover { border-color: #ef4444; color: #ef4444; }

    .dash-empty {
      text-align: center; padding: 80px 24px;
      color: var(--text-sub);
    }
    .dash-empty h3 { font-size: 1.1rem; font-weight: 800; color: var(--ink); margin-bottom: 10px; }
    .dash-empty p { font-size: 0.9rem; line-height: 1.8; }

    .dash-modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(10, 18, 40, 0.55);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .dash-modal-backdrop.is-open { display: flex; }
    .dash-modal {
      background: #fff; border-radius: var(--r-xl);
      max-width: 640px; width: 100%; max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .dash-modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .dash-modal-head h3 { font-size: 1.05rem; font-weight: 800; color: var(--ink); }
    .dash-modal-head .close { cursor: pointer; background: transparent; border: none; font-size: 1.4rem; line-height: 1; color: var(--text-sub); }
    .dash-modal-body { padding: 24px; }
    .dash-modal-row { display: grid; grid-template-columns: 130px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--border-soft); font-size: 0.9rem; }
    .dash-modal-row:last-child { border-bottom: none; }
    .dash-modal-row-label { font-weight: 700; color: var(--text-sub); font-size: 0.82rem; }
    .dash-modal-row-value { color: var(--ink); word-break: break-word; white-space: pre-wrap; line-height: 1.75; }

    @media (max-width: 900px) {
      .dash-stats { grid-template-columns: repeat(2, 1fr); }
      .dash-toolbar { grid-template-columns: 1fr; }
      .dash-table .col-msg { max-width: 200px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner">
      <a href="../index.html" class="site-logo">
        <img src="../images/logo.png" alt="求職者送客の窓口">
      </a>
      <nav class="site-nav">
        <div class="site-nav-links">
          <a href="../index.html">トップ</a>
          <a href="../contact/">お問い合わせ</a>
        </div>
        <span class="btn btn-dark btn-sm" style="pointer-events:none;">管理画面</span>
      </nav>
    </div>
  </header>

  <main class="dash-wrap">
    <div class="dash-head">
      <div class="dash-title">問い合わせダッシュボード<span class="count" id="countLabel">0件</span></div>
      <div style="display:flex; gap:8px;">
        <button class="dash-btn ghost" id="exportBtn">CSVエクスポート</button>
        <button class="dash-btn danger" id="clearBtn">全件削除</button>
      </div>
    </div>

    <div class="dash-note">
      ⚠ このダッシュボードは <strong>ブラウザ内（localStorage）</strong> に保存された送信履歴を表示しています。データはブラウザごとに保持され、端末・ブラウザをまたいで同期されません。正本はSlackチャンネル <code>#お問い合わせ</code>（<code>x-aaaatgnqded6hjsx3iponfqvhy@hado-group.slack.com</code>）で管理してください。
    </div>

    <div class="dash-stats" id="stats"></div>

    <div class="dash-toolbar">
      <input type="search" id="searchInput" placeholder="会社名・名前・メール・内容で検索">
      <select id="filterService">
        <option value="">全サービス</option>
        <option value="第二新卒・未経験領域">第二新卒・未経験</option>
        <option value="新卒領域">新卒</option>
        <option value="両方">両方</option>
        <option value="相談して決めたい">相談</option>
      </select>
      <select id="sortBy">
        <option value="newest">新しい順</option>
        <option value="oldest">古い順</option>
      </select>
    </div>

    <div class="dash-table-wrap" id="tableWrap"></div>
  </main>

  <div class="dash-modal-backdrop" id="modal">
    <div class="dash-modal">
      <div class="dash-modal-head">
        <h3>送信内容詳細</h3>
        <button class="close" type="button" aria-label="close">×</button>
      </div>
      <div class="dash-modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
  (function(){
    var STORAGE_KEY = 'madoguchi_submissions';
    var $ = function(s){ return document.querySelector(s); };
    var countLabel = $('#countLabel');
    var statsEl = $('#stats');
    var wrapEl = $('#tableWrap');
    var searchEl = $('#searchInput');
    var fService = $('#filterService');
    var sortBy = $('#sortBy');
    var modal = $('#modal');
    var modalBody = $('#modalBody');

    function load(){
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); } catch(e){ return []; }
    }
    function save(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

    function fmtDate(iso){
      try {
        var d = new Date(iso);
        return d.toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
      } catch(e){ return iso; }
    }
    function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); }

    function applyFilters(list){
      var q = (searchEl.value||'').trim().toLowerCase();
      var s = fService.value;
      var res = list.filter(function(r){
        if(s && r.service !== s) return false;
        if(q){
          var hay = [r.company,r.name,r.email,r.message,r.department].join(' ').toLowerCase();
          if(hay.indexOf(q) === -1) return false;
        }
        return true;
      });
      if(sortBy.value === 'oldest') res.sort(function(a,b){ return a.submittedAt.localeCompare(b.submittedAt); });
      else res.sort(function(a,b){ return b.submittedAt.localeCompare(a.submittedAt); });
      return res;
    }

    function renderStats(list){
      var today = new Date().toISOString().slice(0,10);
      var m7 = new Date(Date.now() - 7*86400000).toISOString();
      var thisMonth = new Date().toISOString().slice(0,7);
      var todayCount = list.filter(function(r){ return r.submittedAt.slice(0,10) === today; }).length;
      var weekCount = list.filter(function(r){ return r.submittedAt > m7; }).length;
      var monthCount = list.filter(function(r){ return r.submittedAt.slice(0,7) === thisMonth; }).length;
      statsEl.innerHTML = [
        card('総件数', list.length, '件'),
        card('本日の送信', todayCount, '件'),
        card('直近7日', weekCount, '件'),
        card('今月', monthCount, '件')
      ].join('');
    }
    function card(label,val,unit){
      return '<div class="dash-stat"><div class="dash-stat-label">' + label + '</div><div class="dash-stat-value">' + val + '<span class="unit">' + unit + '</span></div></div>';
    }

    function render(){
      var list = load();
      countLabel.textContent = list.length + '件';
      renderStats(list);
      var filtered = applyFilters(list);
      if(filtered.length === 0){
        wrapEl.innerHTML = '<div class="dash-empty"><h3>表示できる問い合わせがありません</h3><p>' + (list.length ? 'フィルタ条件を変更してください。' : 'フォームからお問い合わせが送信されると、ここに一覧表示されます。') + '</p></div>';
        return;
      }
      var rows = filtered.map(function(r){
        return '<tr data-id="' + esc(r.id) + '">'
          + '<td class="col-date">' + esc(fmtDate(r.submittedAt)) + '</td>'
          + '<td class="col-company">' + esc(r.company) + '</td>'
          + '<td>' + esc(r.name) + (r.department ? '<br><span style="color:var(--text-sub);font-size:0.8rem;">' + esc(r.department) + '</span>' : '') + '</td>'
          + '<td><a href="mailto:' + esc(r.email) + '" style="color:var(--brand-blue);">' + esc(r.email) + '</a></td>'
          + '<td><span class="pill">' + esc(r.service || '—') + '</span></td>'
          + '<td>' + esc(r.monthly || '—') + '</td>'
          + '<td class="col-msg">' + esc((r.message||'').slice(0,80)) + ((r.message||'').length>80?'…':'') + '</td>'
          + '<td><div class="dash-row-actions">'
          +   '<button class="view">詳細</button>'
          +   '<button class="del">削除</button>'
          + '</div></td>'
          + '</tr>';
      }).join('');
      wrapEl.innerHTML = '<div style="overflow-x:auto;"><table class="dash-table"><thead><tr>'
        + '<th>送信日時</th><th>会社名</th><th>担当者</th><th>メール</th><th>サービス</th><th>月間面談数</th><th>内容</th><th></th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table></div>';

      wrapEl.querySelectorAll('tbody tr').forEach(function(tr){
        var id = tr.getAttribute('data-id');
        tr.querySelector('.view').addEventListener('click', function(){ openModal(id); });
        tr.querySelector('.del').addEventListener('click', function(){ removeOne(id); });
      });
    }

    function openModal(id){
      var r = load().find(function(x){ return x.id === id; });
      if(!r) return;
      var rows = [
        ['送信日時', fmtDate(r.submittedAt)],
        ['ID', r.id],
        ['会社名', r.company],
        ['部署名・役職', r.department || '—'],
        ['お名前', r.name],
        ['メール', r.email],
        ['ご興味のあるサービス', r.service],
        ['月間希望送客数', r.monthly || '—'],
        ['ご要望・ご質問', r.message || '—']
      ];
      modalBody.innerHTML = rows.map(function(kv){
        return '<div class="dash-modal-row"><div class="dash-modal-row-label">' + esc(kv[0]) + '</div><div class="dash-modal-row-value">' + esc(kv[1]) + '</div></div>';
      }).join('');
      modal.classList.add('is-open');
    }
    modal.addEventListener('click', function(e){
      if(e.target === modal || e.target.classList.contains('close')) modal.classList.remove('is-open');
    });

    function removeOne(id){
      if(!confirm('この送信履歴を削除しますか？')) return;
      var list = load().filter(function(r){ return r.id !== id; });
      save(list); render();
    }

    $('#clearBtn').addEventListener('click', function(){
      if(!confirm('全ての送信履歴を削除します。よろしいですか？')) return;
      localStorage.removeItem(STORAGE_KEY); render();
    });

    $('#exportBtn').addEventListener('click', function(){
      var list = load();
      if(list.length === 0){ alert('エクスポートする履歴がありません。'); return; }
      var headers = ['送信日時','ID','会社名','部署名・役職','お名前','メール','ご興味のあるサービス','月間希望送客数','ご要望・ご質問'];
      var rows = list.map(function(r){
        return [fmtDate(r.submittedAt), r.id, r.company, r.department, r.name, r.email, r.service, r.monthly, (r.message||'').replace(/\n/g,' ')];
      });
      var csv = [headers].concat(rows).map(function(row){
        return row.map(function(c){ var s=String(c==null?'':c); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',');
      }).join('\n');
      var bom = '\uFEFF';
      var blob = new Blob([bom + csv], { type:'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'madoguchi_submissions_' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    });

    searchEl.addEventListener('input', render);
    fService.addEventListener('change', render);
    sortBy.addEventListener('change', render);

    // React to other tabs updating storage
    window.addEventListener('storage', function(e){ if(e.key === STORAGE_KEY) render(); });

    render();
  })();
  </script>
</body>
</html>
