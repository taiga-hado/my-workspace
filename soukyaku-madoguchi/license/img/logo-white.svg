<svg xmlns="http://www.w3.org/2000/svg" width="300" height="48" viewBox="0 0 300 48" role="img" aria-label="免許申請書類 無料作成ツール">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#1f4fd8"/>
    </linearGradient>
  </defs>
  <!-- icon: rounded tile with a document and a yellow check badge -->
  <rect x="2" y="4" width="40" height="40" rx="11" fill="url(#g)"/>
  <rect x="12" y="12" width="20" height="25" rx="3" fill="#fff"/>
  <rect x="15.5" y="17" width="13" height="2" rx="1" fill="#c9d6ff"/>
  <rect x="15.5" y="22" width="13" height="2" rx="1" fill="#c9d6ff"/>
  <rect x="15.5" y="27" width="8" height="2" rx="1" fill="#c9d6ff"/>
  <circle cx="33" cy="34" r="8" fill="#ffcf3d" stroke="#fff" stroke-width="2"/>
  <path d="M29.2 34.2l2.6 2.6 4.6-5" fill="none" stroke="#1f2740" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wordmark -->
  <text x="52" y="21" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="10" font-weight="700" fill="#ffffff" opacity=".78" letter-spacing="1.5">人材紹介（有料職業紹介）の許可申請</text>
  <text x="52" y="39" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="0.5">免許申請書類 <tspan fill="#ffcf3d">無料</tspan>作成ツール</text>
</svg>
