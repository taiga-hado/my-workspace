<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px}
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    background:linear-gradient(161deg,#121E38 0%,#0E1830 52%,#0A1226 100%);
    position:relative;overflow:hidden;color:#fff;-webkit-font-smoothing:antialiased}
  .glow1{position:absolute;right:-170px;top:-230px;width:820px;height:820px;border-radius:50%;
    background:radial-gradient(circle,rgba(58,106,255,.30),rgba(58,106,255,0) 68%)}
  .glow2{position:absolute;right:-250px;bottom:-400px;width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle,rgba(36,87,245,.46),rgba(36,87,245,0) 70%)}
  .frame{position:absolute;inset:0;padding:62px 74px;display:grid;
    grid-template-columns:minmax(0,1fr) 392px;gap:48px;align-items:center;z-index:2}
  .kick{font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.22em;color:#8AA2D8;text-transform:uppercase}
  .kick b{display:block;font-family:"Hiragino Sans",sans-serif;font-size:20px;
    color:#DCE5F7;letter-spacing:.04em;text-transform:none;margin-top:11px;font-weight:600}
  h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:74px;line-height:1.28;
    font-weight:600;letter-spacing:.06em;margin-top:32px}
  .rule{width:74px;height:3px;background:#FF6B2C;margin:28px 0 22px}
  .lead{color:#AEBDD8;font-size:19px;line-height:1.8;max-width:29ch}
  .meta{margin-top:36px;display:flex;gap:42px;font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;letter-spacing:.18em;color:#7185B4;text-transform:uppercase}
  .meta b{display:block;font-family:"Hiragino Sans",sans-serif;font-size:17px;letter-spacing:.02em;
    color:#E7EDF9;text-transform:none;margin-top:7px;font-weight:600}
  svg{width:392px;height:auto;display:block}
</style></head><body>
<div class="glow1"></div><div class="glow2"></div>
<div class="frame">
  <div>
    <div class="kick">Partner Guide<b>求職者送客の窓口　第二新卒・未経験層</b></div>
    <h1>面談で、<br>決める。</h1>
    <div class="rule"></div>
    <p class="lead">導入初日からの運用手順と、成果を出されている各社の面談ノウハウ。</p>
    <div class="meta">
      <div>対象<b>第二新卒・未経験層</b></div>
      <div>発行元<b>株式会社HADO</b></div>
    </div>
  </div>
  <svg viewBox="0 0 268 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#9DB9FF" stop-opacity=".95"/><stop offset="1" stop-color="#3E64D6" stop-opacity=".9"/>
      </linearGradient>
      <linearGradient id="gF" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFC09A"/><stop offset="1" stop-color="#FF7A3C"/>
      </linearGradient>
    </defs>
    <text x="0" y="10" fill="#6E82B2" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="2.6">INTERVIEW DESIGN</text>
    <g stroke="rgba(255,255,255,.085)" stroke-width="1">
      <line x1="26" y1="62" x2="268" y2="62"/><line x1="26" y1="132" x2="268" y2="132"/>
      <line x1="26" y1="202" x2="268" y2="202"/><line x1="26" y1="272" x2="268" y2="272"/>
    </g>
    <g fill="#7488B8" font-family="IBM Plex Mono, monospace" font-size="10" letter-spacing="1.4">
      <text x="0" y="55">01</text><text x="0" y="125">02</text><text x="0" y="195">03</text><text x="0" y="265">04</text>
    </g>
    <rect x="26" y="36" width="126" height="26" rx="7" fill="url(#gB)"/>
    <rect x="26" y="106" width="178" height="26" rx="7" fill="url(#gB)"/>
    <rect x="26" y="176" width="148" height="26" rx="7" fill="url(#gB)"/>
    <rect x="26" y="246" width="96" height="26" rx="7" fill="url(#gF)"/>
    <g font-family="Hiragino Sans, sans-serif" font-size="12" font-weight="600">
      <text x="37" y="54" fill="#0E1B36">初回面談</text>
      <text x="37" y="124" fill="#0E1B36">何を提案するか</text>
      <text x="37" y="194" fill="#0E1B36">2回目面談</text>
      <text x="37" y="264" fill="#3B1B08">内定</text>
    </g>
  </svg>
</div>
</body></html>
